[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-swarm"
version = "1.0.0"
description = "Autonomous Multi-Agent AI System for Emergency Response & Supply Chain Resilience"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.38.0",
    "streamlit-folium>=0.22.0",
    "folium>=0.17.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "psycopg2-binary>=2.9.9",
    "httpx>=0.27.0",
    "requests>=2.32.0",
    "websockets>=12.0",
    "shapely>=2.0.0",
    "polyline>=2.0.0",
    "geopy>=2.4.0",
    "pydantic>=2.0.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "scipy>=1.11.0",
    "joblib>=1.4.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "opentelemetry-api>=1.25.0",
]

[project.optional-dependencies]
llm = [
    "google-genai>=0.3.0",
    "openai>=1.40.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.7.0",
    "black>=24.8.0",
    "isort>=5.13.0",
    "pre-commit>=3.8.0",
]

[tool.setuptools]
py-modules = ["app", "config"]

[tool.setuptools.packages.find]
include = [
    "agents*",
    "database*",
    "evaluation*",
    "llm*",
    "ml*",
    "observability*",
    "rag*",
    "services*",
    "swarm*",
]

[tool.black]
line-length = 110
target-version = ["py311", "py312"]

[tool.isort]
profile = "black"
line_length = 110
known_first_party = [
    "agents",
    "config",
    "database",
    "evaluation",
    "llm",
    "ml",
    "observability",
    "rag",
    "services",
    "swarm",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true
exclude = ["venv/", "alembic/versions/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

